<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="inner-shadow" cx="25%" cy="15%" r="85%">
      <stop offset="0%" stop-color="white" stop-opacity="0.25" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Rounded square: claude orange #D97745, ~22% corner radius for macOS Big Sur grid -->
  <rect width="1024" height="1024" rx="222" fill="#D97745" />
  <rect width="1024" height="1024" rx="222" fill="url(#inner-shadow)" />

  <!-- Coordinates scaled from the asset pack's 120-unit viewBox to 1024
       (multiplier ~= 8.533). Source paths preserved with same proportions. -->
  <g transform="scale(8.5333)" stroke="#FFF7EF" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- >_ prompt: chevron + underscore -->
    <path d="M22 53 L36 63 L22 73" stroke-width="4.5" />
    <path d="M40 73 H54" stroke-width="4.5" />

    <!-- Center hub -->
    <circle cx="72" cy="60" r="6" fill="#FFF7EF" stroke="none" />

    <!-- Branches from hub to three nodes -->
    <path d="M72 60 C 72 60, 75 38, 83 36" stroke-width="3.5" />
    <path d="M72 60 C 72 60, 82 60, 89 66" stroke-width="3.5" />
    <path d="M72 60 C 72 60, 75 80, 83 94" stroke-width="3.5" />

    <!-- Three terminal nodes (circles) -->
    <circle cx="90" cy="36" r="7" stroke-width="3.5" />
    <circle cx="96" cy="66" r="7" stroke-width="3.5" />
    <circle cx="90" cy="94" r="7" stroke-width="3.5" />
  </g>
</svg>
